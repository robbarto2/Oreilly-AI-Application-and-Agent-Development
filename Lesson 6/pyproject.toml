[project]
name = "course-strategy-engine"
version = "0.1.0"
description = "AI-powered curriculum strategy copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.0.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "gitpython>=3.1.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]
